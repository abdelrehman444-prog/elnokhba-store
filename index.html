<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر النخبة | El Nokhba Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header / الشريط العلوي -->
  <header class="bg-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3 space-x-reverse">
        <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl">النخبة</div>
        <h1 class="text-xl font-bold text-gray-800">متجر النخبة</h1>
      </div>
      
      <div class="flex items-center space-x-4 space-x-reverse">
        <!-- زر دخول الأدمن -->
        <button id="adminLoginBtn" onclick="toggleModal('adminModal')" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg transition flex items-center gap-2">
          <i class="fa-solid fa-user-shield text-blue-600"></i>
          <span>دخول الأدمن</span>
        </button>

        <!-- زر السلة -->
        <button onclick="toggleCart()" class="relative bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition flex items-center gap-2 px-4">
          <i class="fa-solid fa-cart-shopping"></i>
          <span class="font-bold">السلة</span>
          <span id="cartCount" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- غلاف المتجر -->
  <section class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-12 px-4 text-center">
    <h2 class="text-3xl font-extrabold mb-2">أهلاً بك في متجر النخبة</h2>
    <p class="text-blue-100 max-w-xl mx-auto">تصفح أفضل المنتجات واطلب مباشرة بدون أي تعقيد عبر الواتساب أو البريد الإلكتروني.</p>
  </section>

  <!-- محتوى المتجر الرئيسي -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-2xl font-bold text-gray-800">المنتجات المتاحة</h3>
      <!-- أزرار أدمن فقط (تظهر بعد الدخول) -->
      <div id="adminControls" class="hidden">
        <button onclick="toggleModal('addProductModal')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> إضافة منتج جديد
        </button>
      </div>
    </div>

    <!-- شبكة المنتجات -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- يتم توليد المنتجات بواسطة الجافاسكربت -->
    </div>
  </main>

  <!-- قائمة السلة الجانبية (Cart Drawer) -->
  <div id="cartDrawer" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden transition-opacity">
    <div class="fixed inset-y-0 left-0 max-w-full flex">
      <div class="w-screen max-w-md bg-white shadow-xl flex flex-col justify-between">
        
        <!-- عنوان السلة -->
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
          <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
            <i class="fa-solid fa-cart-shopping text-blue-600"></i> سلة المشتريات
          </h3>
          <button onclick="toggleCart()" class="text-gray-500 hover:text-gray-700 p-2">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>

        <!-- قائمة المنتجات المضافة -->
        <div id="cartItems" class="p-4 overflow-y-auto flex-grow divide-y divide-gray-100">
          <!-- تضاف هنا تلقائياً -->
        </div>

        <!-- أسفل السلة / أزرار الشراء المباشر -->
        <div class="p-4 border-t bg-gray-50 space-y-3">
          <div class="flex justify-between items-center text-lg font-bold">
            <span>الإجمالي:</span>
            <span id="cartTotal" class="text-blue-600">0 ج.م</span>
          </div>

          <div class="space-y-2 pt-2">
            <button onclick="checkoutWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 shadow-md transition">
              <i class="fa-brands fa-whatsapp text-xl"></i> الشراء المباشر عبر واتساب
            </button>
            <button onclick="checkoutMailto()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 shadow-md transition">
              <i class="fa-solid fa-envelope text-xl"></i> الشراء عبر البريد الإلكتروني
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- نافذة تسجيل دخول الأدمن -->
  <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
      <button onclick="toggleModal('adminModal')" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h3 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">تسجيل دخول الأدمن</h3>
      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
          <input type="email" id="adminEmail" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="abdelrehman444@gmail.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
          <input type="password" id="adminPassword" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="******">
        </div>
        <p id="adminLoginError" class="text-red-500 text-sm hidden">بيانات الدخول غير صحيحة!</p>
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 transition">دخول</button>
      </form>
    </div>
  </div>

  <!-- نافذة إضافة منتج جديد (للأدمن فقط) -->
  <div id="addProductModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 relative">
      <button onclick="toggleModal('addProductModal')" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
      <h3 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">إضافة منتج جديد</h3>
      <form onsubmit="handleAddProduct(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">اسم المنتج</label>
          <input type="text" id="prodTitle" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">السعر (ج.م)</label>
          <input type="number" id="prodPrice" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">رابط الصورة (URL)</label>
          <input type="url" id="prodImage" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://via.placeholder.com/300">
        </div>
        <button type="submit" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg hover:bg-green-700 transition">إضافة المنتج</button>
      </form>
    </div>
  </div>

  <!-- أزرار التواصل العائمة (واتساب وتليجرام) -->
  <div class="fixed bottom-6 left-6 flex flex-col gap-3 z-40">
    <a href="https://wa.me/201093082268" target="_blank" class="bg-green-500 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg hover:bg-green-600 transition text-2xl" title="تواصل عبر واتساب">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
    <a href="https://t.me/+201093082268" target="_blank" class="bg-blue-500 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg hover:bg-blue-600 transition text-2xl" title="تواصل عبر تليجرام">
      <i class="fa-brands fa-telegram"></i>
    </a>
  </div>

  <!-- تذييل الصفحة -->
  <footer class="bg-gray-800 text-gray-300 py-6 text-center text-sm mt-auto">
    <p>© 2026 جميع الحقوق محفوظة لـ <strong>متجر النخبة</strong></p>
  </footer>

  <!-- الأكواد البرمجية (الجافاسكربت) -->
  <script>
    // المنتجات المبدئية
    let products = JSON.parse(localStorage.getItem('elnokhba_products')) || [
      { id: 1, title: "منتج مميز 1", price: 150, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" },
      { id: 2, title: "منتج مميز 2", price: 300, image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" },
      { id: 3, title: "منتج مميز 3", price: 220, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" }
    ];

    let cart = [];
    let isAdmin = false;

    // عرض المنتجات
    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition flex flex-col">
          <img src="${p.image}" alt="${p.title}" class="w-full h-48 object-cover">
          <div class="p-4 flex-grow flex flex-col justify-between">
            <div>
              <h4 class="font-bold text-gray-800 text-lg mb-1">${p.title}</h4>
              <p class="text-blue-600 font-bold text-md mb-4">${p.price} ج.م</p>
            </div>
            <div class="space-y-2">
              <button onclick="addToCart(${p.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
              </button>
              ${isAdmin ? `
                <button onclick="deleteProduct(${p.id})" class="w-full bg-red-100 hover:bg-red-200 text-red-600 font-bold py-1.5 rounded-lg text-xs transition">
                  <i class="fa-solid fa-trash"></i> حذف المنتج (أدمن)
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    // عمليات السلة
    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...prod, qty: 1 });
      }
      updateCartUI();
      // فتح السلة تلقائياً عند إضافة منتج
      document.getElementById('cartDrawer').classList.remove('hidden');
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        item.qty += delta;
        if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
    }

    function updateCartUI() {
      const cartCount = document.getElementById('cartCount');
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');

      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      cartCount.textContent = totalItems;
      cartTotal.textContent = `${totalPrice} ج.م`;

      if (cart.length === 0) {
        cartItems.innerHTML = `<div class="text-center text-gray-400 py-12">السلة فارغة حالياً</div>`;
        return;
      }

      cartItems.innerHTML = cart.map(item => `
        <div class="py-3 flex justify-between items-center">
          <div>
            <h5 class="font-bold text-gray-800 text-sm">${item.title}</h5>
            <p class="text-gray-500 text-xs">${item.price} ج.م × ${item.qty}</p>
          </div>
          <div class="flex items-center space-x-2 space-x-reverse bg-gray-100 rounded-lg p-1">
            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-white rounded shadow text-gray-600 font-bold">-</button>
            <span class="text-sm px-2 font-bold">${item.qty}</span>
            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-white rounded shadow text-gray-600 font-bold">+</button>
          </div>
        </div>
      `).join('');
    }

    function toggleCart() {
      document.getElementById('cartDrawer').classList.toggle('hidden');
    }

    function toggleModal(modalId) {
      document.getElementById(modalId).classList.toggle('hidden');
    }

    // إرسال الطلبات مباشرة
    function checkoutWhatsApp() {
      if (cart.length === 0) { alert('السلة فارغة!'); return; }
      let text = "طلب جديد من متجر النخبة:\n\n";
      cart.forEach(item => { text += `• ${item.title} (الكمية: ${item.qty}) - ${item.price * item.qty} ج.م\n`; });
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      text += `\nالإجمالي: ${total} ج.م`;
      
      const url = `https://wa.me/201093082268?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    function checkoutMailto() {
      if (cart.length === 0) { alert('السلة فارغة!'); return; }
      let body = "طلب جديد من متجر النخبة:\n\n";
      cart.forEach(item => { body += `• ${item.title} (الكمية: ${item.qty}) - ${item.price * item.qty} ج.م\n`; });
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      body += `\nالإجمالي: ${total} ج.م`;

      const mailtoUrl = `mailto:abdelrehman444@gmail.com?subject=${encodeURIComponent("طلب جديد من متجر النخبة")}&body=${encodeURIComponent(body)}`;
      window.location.href = mailtoUrl;
    }

    // إدارة دخول الأدمن
    function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const pass = document.getElementById('adminPassword').value;

      if (email === 'abdelrehman444@gmail.com' && pass === 'abdelrehman') {
        isAdmin = true;
        document.getElementById('adminControls').classList.remove('hidden');
        document.getElementById('adminLoginBtn').classList.add('hidden');
        document.getElementById('adminLoginError').classList.add('hidden');
        toggleModal('adminModal');
        renderProducts();
        alert('تم تسجيل دخول الأدمن بنجاح!');
      } else {
        document.getElementById('adminLoginError').classList.remove('hidden');
      }
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const title = document.getElementById('prodTitle').value;
      const price = parseFloat(document.getElementById('prodPrice').value);
      const image = document.getElementById('prodImage').value;

      const newProd = { id: Date.now(), title, price, image };
      products.push(newProd);
      localStorage.setItem('elnokhba_products', JSON.stringify(products));
      renderProducts();
      toggleModal('addProductModal');
      e.target.reset();
    }

    function deleteProduct(id) {
      if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('elnokhba_products', JSON.stringify(products));
        renderProducts();
      }
    }

    // التشغيل المبدئي
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
